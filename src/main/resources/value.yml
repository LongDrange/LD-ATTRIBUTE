# ============================================================
# 自定义值 / 变量（YeeValue 风格）
#
# 每个值可以有：
#   Name         显示名（带 & 颜色码）
#   Description  说明
#   Default      默认值
#   Min          最小值（默认 0）
#   Max          最大值
#   AutoRegen    定时恢复（可选）
#     Amount       每次恢复数量
#     Interval     间隔秒数
#     Max          恢复到多少就停
# ============================================================

Values:

  # ============ 示例：金币 ============
  金币:
    Name: "&6金币"
    Description: "&7服务器通用货币"
    Default: 0
    Min: 0
    Max: 999999999

  # ============ 示例：体力（自动恢复）============
  体力:
    Name: "&a体力"
    Description: "&7每 60 秒恢复 5 点"
    Default: 100
    Min: 0
    Max: 100
    AutoRegen:
      Amount: 5
      Interval: 60
      Max: 100

  # ============ 示例：声望 ============
  声望:
    Name: "&d声望"
    Description: "&7用于解锁高级商店"
    Default: 0
    Min: 0
    Max: 100000

  # ============ 示例：天赋点（给天赋系统用）============
  天赋点:
    Name: "&b天赋点"
    Description: "&7用于加点天赋"
    Default: 0
    Min: 0
    Max: 10000

  # ============ 示例：疲劳值 ============
  疲劳:
    Name: "&c疲劳"
    Description: "&7每 30 秒恢复 1 点"
    Default: 0
    Min: 0
    Max: 100
    AutoRegen:
      Amount: 1
      Interval: 30
      Max: 100