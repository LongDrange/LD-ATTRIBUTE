# ============================================================
# 饰品背包配置（多页 + 完全自定义）
#
# Lore 识别规则：
#   物品类型: 饰品
#   饰品槽位: <对应 SlotDef 的 LoreKey>
#
# 结构：
#   DefaultPage: <默认打开的页 id>
#   Pages:
#     <页id>:
#       Title: "<GUI 标题>"
#       Slots:
#         <槽位id>:
#           Name: "<显示名>"
#           LoreKey: "<Lore里 饰品槽位: 后写的内容>"
#           GuiSlot: <界面第几格 0-44>
#           Icon: "<空槽材质>"
#           Permission: ""              # 需要的权限，留空不校验
#           CostPoints: 0               # 预留
#           CostVault: 0                # 预留
#           Items: []                   # 预留
# ============================================================

DefaultPage: "main"

Pages:

  # ============ 主装备页 ============
  main:
    Title: "&8&l✦ 饰品背包 &7- 主装备"
