# ============================================================
#  [分类] 战斗
#  [文件] state.yml
#  [功能] 战斗状态：中毒 / 燃烧 / 冰冻等
#  [重载] /ldc reload state
#  [路径] plugins/LD-Attribute/state.yml
# ============================================================
# ================================================
#   战斗状态属性
#   Condition 格式:
#     HP_BELOW:30        血量低于 30%
#     HP_ABOVE:80        血量高于 80%
#     KILL_STREAK:3      连杀 3 次以上
#   Attributes: 满足条件时临时附加的属性
# ================================================

States:
  low_hp_rage:
    Name: "低血狂暴"
    Condition: "HP_BELOW:30"
    Attributes:
    - "&c攻击力: +200"
    - "&cPVP攻击力: +100"
    Message: "&c✘ 低血狂暴触发！"

