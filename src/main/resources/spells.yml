# ================================================
#   法術配置（改完 /ldc reload 生效）
#
#   可用變量：
#     {base}           法術 Base 值
#     {magic_damage}   玩家「法术伤害」屬性
#     {magic_pen}      玩家「法术穿透」屬性
#     {magic_crit}     玩家「法术暴击几率」屬性
#     {magic_crit_dmg} 玩家「法术暴击倍率」屬性
#
#   Target 類型：
#     SELF    對自己
#     SINGLE  視線前方單體
#     AOE     周圍範圍
#     BEAM    直線穿透
#     CONE    扇形範圍
#
#   Effects 格式：
#     PARTICLE:<粒子名>:<數量>
#     SOUND:<音效名>
#
#   MythicSkill: 如果裝了 MythicMobs，額外觸發技能名（可留空）
# ================================================

