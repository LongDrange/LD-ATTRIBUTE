# ============================================================
# 额外属性来源（用于 /ldc stats 显示和属性计算）
#
# 每条格式：
#   Name:     显示名
#   Enabled:  true/false（默认 true）
#   Provider: 完整类名
#   Method:   静态方法名（签名必须是：static List<String> xxx(Player)）
#
# 方法返回的 List 每行格式："属性名: +数值"
# 例如：["攻击力: +100", "防御力: +50"]
# ============================================================

Sources:
  - Name: "SX-Attribute"
    Enabled: true
    Provider: "com.longdrange.ldattribute.core.compat.SXAttributeCompat"
    Method: "getSXAttributes"

  - Name: "AttributePlus"
    Enabled: true
    Provider: "com.longdrange.ldattribute.core.compat.AttributePlusCompat"
    Method: "getAPAttributes"
