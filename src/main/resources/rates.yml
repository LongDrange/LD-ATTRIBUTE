# ============================================================
# 灵魂空间倍率配置
# ============================================================
# 逻辑：玩家最终倍率 = max(权限倍率, 限时倍率) + 幸运加成
# ============================================================

Settings:
  # 默认倍率（无任何权限/限时时使用）
  Default: 1

  # OP 是否跳过权限倍率（OP 默认拥有所有权限，会误吃所有 VIP 倍率）
  # true  = OP 只吃限时倍率 + 幸运
  # false = OP 也吃权限倍率
  IgnoreOp: true

  # ===== 幸运加成 =====
  Luck:
    # 是否启用幸运加成
    Enabled: true
    # ADD: 最终 = 基础倍率 + 幸运加成
    # MULTIPLY: 最终 = 基础倍率 * (1 + 幸运加成)
    Mode: ADD
    # 除数（幸运 100 除以 100 = 1.0 加成）
    Divisor: 100.0
    # 读哪个属性作为幸运
    AttributeName: "幸运"
    # 基准幸运：幸运 ≤ 此值时不算加成
    # 你的 LuckAttribute 默认值 = 100，所以填 100 → 默认无加成（1倍）
    BaseLuck: 100

# ============================================================
# 权限倍率规则
# ============================================================
# 最终权限倍率 = max(非叠加规则最高值, 叠加规则总和)
# 再与限时倍率、幸运加成取最大值
# ============================================================
Rules:

  vip:
    Name: "&b&lVIP 双倍掉落"
    Value: 2
    Permission: "soulring.vip"
    Stack: false

  svip:
    Name: "&c&lSVIP 三倍掉落"
    Value: 3
    Permission: "soulring.svip"
    Stack: false

  activity:
    Name: "&e&l活动加成 +0.5"
    Value: 0.5
    Permission: "soulring.activity"
    Stack: true

# ============================================================
# 使用说明
# ============================================================
# 权限倍率例子：
#   无权限：1
#   有 soulring.vip：2
#   有 soulring.svip：3
#   有 soulring.activity：1.5（0.5 加成）
#
# 限时倍率（命令）：
#   /ldsr rate add <玩家> <倍率> <时间>
#   例: /ldsr rate add LongBing 3 1h
#
# 幸运加成：
#   幸运 = 100（默认）→ 加成 0 → 1 倍
#   幸运 = 150        → 加成 +0.5 → 1.5 倍
#   幸运 = 200        → 加成 +1 → 2 倍
#
# 最终倍率 = max(权限倍率, 限时倍率) + 幸运加成