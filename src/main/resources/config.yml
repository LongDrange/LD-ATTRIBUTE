Settings:
  UsePlaceholderAPI: true
  UpdateInterval: 20
  Debug: false

Message:
  Prefix: "&8[&bLD-Attribute&8] &r"
  NoPermission: "&c你沒有權限！"
  Reloaded: "&a配置已重新載入！"

# 卡片系統設定
CardInventory:
  # 預設可用格數（必須是 9 的倍數，最大 45）
  DefaultSlots: 36
  # 最大格數
  MaxSlots: 45    # 卡片區最大格數（不含底部按鈕列）
  # 每升級一次增加幾格
  SlotPerUpgrade: 9    # 每次升級增加格數
  # 升級花費（TcPoints 點數）
  UpgradeCost: 100    # 每次升級花費點券
  # 底部分隔線材質（160:15 = 黑色玻璃板）
  Separator: 160
  SeparatorData: 15

# 販賣設定
SellCard:
  Enabled: true
  # 販賣倍率（1.0 = 原價）
  Rate: 1.0

# ===== 自动备份 =====
Backup:
  # 每 N 分钟备份一次
  IntervalMinutes: 60
  # 保留最近 N 份（1 天 = 24 份）
  MaxBackups: 24