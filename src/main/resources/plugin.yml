name: LD-Attribute
version: 1.2.0
main: com.longdrange.ldattribute.LDAttribute
api-version: "1.12"
author: LongDrange
description: 自定義 RPG 屬性 + 多頁卡片 + 圖鑑 + 套裝 + 合成 + 等級 + 綁定
website: ""
softdepend:
  - PlaceholderAPI
  - MythicMobs
  - Vault
commands:
  ldattribute:
    aliases: [lda, ldattr]
    description: LD-Attribute 主指令
  ldcardstats:
    aliases: [ldc]
    description: LD-CardStats 卡片指令（子指令可在 command.yml 自定義）
  ldpoints:
    aliases: [ldp]
    description: LD-Points 點券指令
  ldcore:
    aliases: [lcore]
    description: LD-Core 核心模块指令
  ldring:
    aliases: [ring, hzring]
    description: 魂珠空间
    usage: /ldring
  ldsp:
    aliases: [jewelry, sp]
    description: 饰品背包
    usage: /ldsp [页id]
  ldtalent:
    aliases: [talent, tl]
    description: 天赋加点
    usage: /ldtalent [页id]
  ldguide:
    aliases: [guide, gd]
    description: 怪物图鉴
    usage: /ldguide
  ldvalue:
    aliases: [value, val, yeevalue]
    description: 自定义值
    usage: /ldvalue
  ldsb:
    aliases: [sb, sidebar]
    description: 侧边栏开关
    usage: /ldsb
  ldsr:
    aliases: [soulring, sr]
    description: 灵魂空间
    usage: /ldsr
permissions:
  # ===== LD-Attribute 主功能 =====
  ldattribute.command.list:
    description: 允許使用 /lda list
    default: op
  ldattribute.command.info:
    description: 允許使用 /lda info
    default: op
  ldattribute.command.reload:
    description: 允許使用 /lda reload
    default: op
  ldattribute.command.give:
    description: 允許使用 /lda give（給屬性物品）
    default: op
  # ===== 卡片系統（玩家用） =====
  ldattribute.card.open:
    description: 允許使用 /ldc open 打開卡片背包
    default: true
  ldattribute.card.collection:
    description: 允許使用 /ldc collection 打開卡片圖鑑
    default: true
  ldattribute.card.merge:
    description: 允許使用 /ldc merge 進行合成
    default: true
  # ===== 卡片系統（管理員用） =====
  ldattribute.command.give:
    description: 允許使用 /ldc give 給予卡片
    default: op
  ldattribute.command.save:
    description: 允許使用 /ldc save 儲存手上物品為卡片
    default: op
  ldattribute.command.reload:
    description: 允許使用 /ldc reload 重載配置
    default: op
  # ===== 點券系統 =====
  ldattribute.points.admin:
    description: 點券管理員權限（/ldp add/take/set）
    default: op

    ldattribute.command.admin:
      description: 管理員指令（unlock/reset/remove/star/level/exp/info/msg）
      default: op
  # ===== LD-Core 核心模块 =====
  ldattribute.core.admin:
    description: LD-Core 管理员权限（reload/save/modules）
    default: op
  # ===== 魂珠空间 =====
  ldattribute.ring.admin:
    description: 魂珠空间管理权限
    default: op
  # ===== 饰品背包 =====
  ldattribute.jewelry.admin:
    description: 饰品背包管理权限
    default: op
  # ===== 天赋 =====
  ldattribute.talent.admin:
    description: 天赋管理权限
    default: op
  # ===== 怪物图鉴 =====
  ldattribute.guide.admin:
    description: 图鉴管理权限
    default: op
  # ===== 自定义值 =====
  ldattribute.value.admin:
    description: 自定义值管理权限
    default: op
  # ===== 侧边栏 =====
  ldattribute.scoreboard.admin:
    description: 侧边栏管理权限
    default: op
  # ===== 灵魂空间 =====
  ldattribute.soulring.admin:
    description: 灵魂空间管理权限
    default: op
