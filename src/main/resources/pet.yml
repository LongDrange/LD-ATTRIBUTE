# ================================================
#   宠物系统配置
#
#   Settings:
#     DefaultSlots: 一般玩家可放几个宠物
#     PermissionSlots: 权限 → 槽位数
#     MaxPages: 最大页数
#     ExpPerKill: 击杀怪物获得的经验
#     ExpPerFeed: 喂食（用道具）获得的经验
#
#   Pets:
#     Type: 原版实体类型
#     Attributes: 给主人的属性加成
#     每级 +LevelGrowth% 的属性成长
#
#   Evolution: 进化配置
#     To: 进化后宠物ID
#     Level: 需要等级
#     Materials: 需要材料 ["DIAMOND:64"]
# ================================================

