# ================================================
#   合成配方
#   Display: 顯示名（GUI）
#   Icon: GUI 圖示（可選，預設用輸出卡）
#   Input.Cards: 需要卡片（"卡ID:數量"）
#   Cost:
#     Points: 點券 / Vault: 金幣 / Items: 物品 / Permission: 權限
#   Output.Cards: 固定產出
#   Output.Random: 隨機池（"卡ID:權重"）
# ================================================

Recipes:
  upgrade_sunxun:
    Display: "&6孙逊 進階"
    Input:
      Cards:
      - "孙逊:3"
    Cost:
      Points: 500
    Output:
      Cards:
      - "孙逊:1"
  three_heroes:
    Display: "&d三俠合璧"
    Input:
      Cards:
      - "孙逊:1"
      - "貂蝉:1"
      - "庞德:1"
    Cost:
      Points: 5000
      Vault: 5000
    Output:
      Cards:
      - "貂蝉:1"
  strengthen_pangde:
