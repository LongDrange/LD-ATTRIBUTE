      - "庞德:1"
  gacha_basic:
    Display: "&e隨機抽卡"
    Input:
      Cards: []
    Cost:
      Points: 1000
    Output:
      Random:
      - "孙逊:40"
      - "貂蝉:30"
      - "庞德:30"

