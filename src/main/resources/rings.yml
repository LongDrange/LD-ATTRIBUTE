# ============================================================
# 魂珠空间配置
# ============================================================

Settings:
  Title: "&8&l✦ 魂珠空间 &7- 第 %page%/%max_page% 页"
  SlotsPerPage: 36
  DefaultPages: 1
  DefaultMaxStack: 64

# 每个魂珠类型独立上限
# 优先级：物品 lore "上限: N" > 这里 > DefaultMaxStack
TypeLimits:
  fire_ring: 50
  ice_ring: 100
  thunder_ring: 30

# ============================================================
# 属性名映射
# 让你的魂珠 lore 里可以写这些别名，系统会自动映射到插件的真实属性名
# 用于兼容 SX-Attribute 的属性名风格
# 格式: 别名: 插件真实属性名（用 /ldring attrs 查）
# ============================================================
AttributeMapping:
  # SX 风格 → LD-Attribute 属性
  物理攻击: 攻擊力
  物理防御: 防禦力
  生命值: 生命上限
  暴击率: 暴击機率
  暴击几率: 暴击機率
  暴击伤害: 暴擊傷害
  暴击倍率: 暴擊傷害
  吸血率: 吸血
  移动速度: 移动速度
  攻击速度: 攻击速度
  法术强度: 法术伤害
  法术攻击: 法术伤害
  # 简体 → 繁体（保险起见）
  攻击力: 攻擊力
  防御力: 防禦力
  生命上限: 生命上限
  闪避: 閃避
  韧性: 韌性
  反射: 反射
  格挡: 格擋
  破甲: 破甲
  命中率: 命中率
  法力上限: 法力上限
  法力恢复: 法力恢复
  幸运: 幸运

# 页面解锁（key 是目标页索引，从 0 开始；0 是首页默认解锁）
PageUnlock:
  1:
    Permission: ""
    CostPoints: 100
    CostVault: 1000
    Items: []
  2:
    Permission: ""
    CostPoints: 500
    CostVault: 5000
    Items:
      - "DIAMOND:16"
      - "EMERALD:8"

# ============================================================
# SX-Attribute 对接说明
# ============================================================
# 本插件通过 PlaceholderAPI 桥接 SX-Attribute，无需直接依赖 SX。
#
# 用法：在 SX-Attribute 的属性公式里，用下面这些变量读取魂珠属性：
#
#   %ldring_total_攻击力%      魂珠提供的攻击力总数
#   %ldring_total_防禦力%      魂珠提供的防御力总数
#   %ldring_total_暴击機率%    魂珠提供的暴击率总数
#   ...
#
# 例：假设 SX 的"物理攻击"公式是 基础值 + 装备加成
# 想让魂珠也算进去，可以改成：
#   基础值 + 装备加成 + %ldring_total_攻击力%
#
# 可用变量（%ldring_ 前缀）：
#   total_<属性>   所有魂珠累计某属性
#   count_<类型>   某类型魂珠数量
#   max_<类型>     某类型上限
#   limit_<类型>   某类型还能放多少
#   has_<类型>     是否拥有 (1/0)
#   slots          已解锁槽位数
#   pages          已解锁页数
#   types          已占用类型数
# ============================================================