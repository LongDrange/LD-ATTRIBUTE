# ============================================================
# 掉落增强配置（LD 掉落表）
# ============================================================
# 顶层 key = MythicMobs 怪物的内名（InternalName）
# 特殊 key: "*" = 通用掉落（所有 MM 怪物都掉）
#
# 每个条目的字段：
#   id:          物品定义（支持 RING:<ID> / CARD:<ID> / RUNE:<ID> / 材质:数量）
#   chance:      基础几率 0.0 ~ 1.0（0.05 = 5%）
#   amount:      数量（"1" 或 "1~3" 范围）
#   useDropRate: 是否受爆率属性加成（默认 true）
#   broadcast:   掉落时全服通告（默认 false）
#   permission:  需要权限才能掉（可空）
#   dailyLimit:  每日限制掉几次（0 = 无限）
# ============================================================

# ===== 骷髅王 =====
SkeletonKing:
  - id: "DIAMOND:1"
    chance: 0.05
    amount: 1
    useDropRate: true
  - id: "GOLD_INGOT:1"
    chance: 0.5
    amount: "1~3"
    useDropRate: true
  - id: "RING:fire_ring:1"
    chance: 0.02
    amount: 1
    useDropRate: true
    broadcast: true

# ===== 通用掉落（所有 MM 怪物都可能掉）=====
"*":
  - id: "EXP_BOTTLE:1"
    chance: 0.1
    amount: "1~5"
    useDropRate: true